# nginx server block for the playground's static build (spec: Deployment).
# Point `root` at the build output; everything else is required as written.

types {
    application/wasm  wasm;
}

server {
    listen 80;
    server_name _;
    root /srv/pyplay/dist;

    # A-03 / NFR-004: the 15 MB budget assumes compressed transfer.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/css text/javascript application/javascript application/json application/wasm;
    # Requires ngx_brotli; preferred over gzip when available.
    # brotli            on;
    # brotli_types      text/css text/javascript application/javascript application/json application/wasm;
    # brotli_static     on;

    # BR-002: cross-origin isolation on every response of this site, so
    # SharedArrayBuffer is available and FR-015's disabled state never applies.
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Fingerprinted and vendored runtime assets never change under their name.
    location ~* ^/(assets|pyodide|ruff)/ {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # FR-053: the shell and the service worker must revalidate every time, or a
    # new deployment can never reach an existing visitor.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        default_type text/javascript;
    }

    location = /precache-manifest.json {
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
