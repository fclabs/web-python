# Netlify deployment shape (spec: Deployment).

[build]
  command = "npm run build"
  publish = "dist"

# Cross-origin isolation on every HTML response (BR-002, FR-015).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# index.html and the service worker must never be served stale, or a new
# deployment can never reach the visitor (FR-053).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/precache-manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Fingerprinted and vendored runtime assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pyodide/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ruff/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serving WASM as application/octet-stream breaks Safari (Deployment).
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
