<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python Playground</title>
    <!-- FR-515 / BR-505: render-blocking bootstrap before any stylesheet that
         paints chrome colours. Allow-list matches BR-501 / src/theme.ts. -->
    <script>
      (function () {
        var KEY = 'pyplay.theme.v1';
        var pref = 'system';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw === 'light' || raw === 'dark' || raw === 'system') pref = raw;
        } catch (e) {}
        document.documentElement.dataset.theme = pref;
        var osDark = false;
        try {
          osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var effective =
          pref === 'dark' || (pref === 'system' && osDark) ? 'dark' : 'light';
        /* data-effective freezes System chrome against mid-session OS flips
           (FR-510 / BR-502); data-theme still mirrors the preference (FR-514). */
        document.documentElement.dataset.effective = effective;
        document.documentElement.style.colorScheme = effective;
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar" role="toolbar" aria-label="Playground controls">
        <button id="btn-run" class="btn btn--primary" type="button" tabindex="0" aria-disabled="true">Run</button>
        <button id="btn-stop" class="btn" type="button" tabindex="0" aria-disabled="true">Stop</button>
        <button id="btn-clear" class="btn" type="button">Clear console</button>
        <button id="btn-copy" class="btn" type="button">Copy code</button>
        <button id="btn-format" class="btn" type="button" tabindex="0" aria-disabled="true">Format</button>
        <button id="btn-reset" class="btn" type="button">Reset</button>
        <button id="btn-files" class="btn" type="button" aria-expanded="false" aria-controls="file-pane">Files</button>
        <!-- FR-301: immediately before the color-mode control. It has no
             disabled state, so unlike Run/Stop/Format it is never routed
             through `setInert()`. -->
        <button
          id="btn-symbols"
          class="btn"
          type="button"
          tabindex="0"
          aria-expanded="false"
          aria-controls="symbol-pane"
        >Symbols</button>
        <!-- FR-501: last toolbar control. Glyph / title / aria-label filled by
             src/theme.ts. Never routed through `setInert()`. Explicit
             `tabindex="0"` matches Run/Stop/Format so WebKit keeps the control
             in the sequential focus navigation order (FR-513 / VC-511). -->
        <button id="btn-theme" class="btn btn--theme" type="button" tabindex="0"></button>
      </header>

      <p id="coi-banner" class="banner" role="status" hidden></p>

      <p id="status-bar" class="status-bar" aria-live="polite">Loading Python… 0%</p>

      <div id="notices" class="notices" aria-live="polite"></div>

      <!-- FR-317: the pane sits here in the document at every viewport width;
           the wide layout's inline-end column is grid placement only. Its 29
           character buttons are rendered from `src/symbols.ts`. -->
      <section
        id="symbol-pane"
        class="panel panel--symbols"
        role="toolbar"
        aria-label="Special characters"
        aria-orientation="vertical"
        hidden
      >
        <p id="symbol-status" class="symbol-status" role="status"></p>
      </section>

      <section class="panel panel--console" aria-label="Console">
        <div id="console" class="console"></div>
      </section>

      <!-- FR-317 pins only `#symbol-pane`'s position (between `#notices` and
           the console panel); the files pane sits here instead, and its
           `.panel--files` grid-area places it visually without moving it in
           the document. -->
      <section id="file-pane" class="panel panel--files" aria-label="Files" hidden>
        <div class="files-heading">
          <h2 class="panel-title">Files</h2>
          <div class="files-actions">
            <button id="btn-file-new" class="btn btn--small" type="button">New</button>
            <button id="btn-file-rename" class="btn btn--small" type="button" aria-disabled="true">Rename</button>
            <button id="btn-file-delete" class="btn btn--small" type="button" aria-disabled="true">Delete</button>
          </div>
        </div>
        <input id="file-name-input" class="file-name-input" type="text" hidden />
        <ul id="file-tree" class="file-tree" role="tree" aria-label="Workspace files"></ul>
        <div
          id="file-resizer"
          class="file-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize files panel"
          aria-valuemin="160"
          aria-valuemax="480"
          aria-valuenow="260"
          tabindex="0"
        ></div>
      </section>

      <section class="panel panel--editor" aria-label="Editor">
        <h2 class="editor-heading">Editing: <span id="active-file-name">main.py</span></h2>
        <div id="editor" class="editor"></div>
      </section>

      <section class="panel panel--stdin" aria-label="Standard input">
        <label class="stdin-label" for="stdin-input">Input</label>
        <input
          id="stdin-input"
          class="stdin-input"
          type="text"
          autocomplete="off"
          placeholder="El programa no está esperando entrada"
          tabindex="0"
          aria-disabled="true"
          readonly
        />
        <button id="btn-eof" class="btn" type="button" tabindex="0" aria-disabled="true">Send EOF</button>
      </section>

      <section class="panel panel--diagnostics" aria-label="Diagnostics">
        <h2 class="panel-title">
          Problems <span id="diagnostics-count" class="count">0</span>
        </h2>
        <ul id="diagnostics-list" class="diagnostics-list"></ul>
        <p id="diagnostics-empty" class="diagnostics-empty">Linter unavailable.</p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
