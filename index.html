<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python Playground</title>
    <!-- FR-515 / BR-505: render-blocking bootstrap before any stylesheet that
         paints chrome colours. Allow-list matches BR-501 / src/theme.ts. -->
    <script>
      (function () {
        var KEY = 'pyplay.theme.v1';
        var pref = 'system';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw === 'light' || raw === 'dark' || raw === 'system') pref = raw;
        } catch (e) {}
        document.documentElement.dataset.theme = pref;
        var osDark = false;
        try {
          osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var effective =
          pref === 'dark' || (pref === 'system' && osDark) ? 'dark' : 'light';
        /* data-effective freezes System chrome against mid-session OS flips
           (FR-510 / BR-502); data-theme still mirrors the preference (FR-514). */
        document.documentElement.dataset.effective = effective;
        document.documentElement.style.colorScheme = effective;
      })();
    </script>
    <!-- FR-910 / FR-1311: apply stored diagnostics height, Output visibility,
         column width, and console height before CSS paint. Non-canonical /
         missing → leave unset. Regex matches isCanonicalDiagHeight /
         isCanonicalOutputWidth. -->
    <script>
      (function () {
        var re = /^[1-9][0-9]*$/;
        function px(key, prop, flag) {
          try {
            var raw = localStorage.getItem(key);
            if (raw && re.test(raw)) {
              document.documentElement.style.setProperty(prop, raw + 'px');
              document.documentElement.dataset[flag] = '';
            }
          } catch (e) {}
        }
        px('pyplay.diagnostics-height.v1', '--diagnostics-height', 'diagSized');
        px('pyplay.output-width.v1', '--output-width', 'outputSized');
        px('pyplay.console-height.v1', '--console-height', 'consoleSized');
        try {
          if (localStorage.getItem('pyplay.output-visible.v1') === 'hidden')
            document.documentElement.dataset.output = 'hidden';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar" role="toolbar" aria-label="Playground controls">
        <button id="btn-run" class="btn btn--primary" type="button" tabindex="0" aria-disabled="true"><span id="run-action">Run</span><span id="run-file-name">Python file</span></button>
        <button id="btn-stop" class="icon-button btn" type="button" tabindex="0" aria-disabled="true" title="Stop">
          <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg>
          <span class="control-label visually-hidden">Stop</span>
        </button>
        <button id="btn-reset" class="icon-button btn" type="button" title="Reset">
          <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg>
          <span class="control-label visually-hidden">Reset</span>
        </button>
        <!-- spec-04 FR-401: immediately after `#btn-reset`. A `radiogroup`
             is one tab stop (FR-405), so the roving `tabindex` below is what
             keeps the toolbar's tab-order enumeration unchanged in length by
             more than one (parent VC-052).

             spec-04's DOM contract also calls this the toolbar's last child;
             spec-03 FR-301 / VC-301 had already claimed that slot for
             `Symbols`. FR-401's own Given/When/Then says "immediately after
             `#btn-reset`", which is what ships — see the amendment recorded
             in `specs/04-toogle-pane-aspect.md`. -->
        <div id="layout-group" class="segmented" role="radiogroup" aria-label="Layout">
          <!-- FR-1404: icons depict the panel arrangement. Internal horizontal /
               vertical values still name the divider; Stacked is first and
               remains the effective layout below 900 px. -->
          <button
            id="layout-horizontal"
            class="icon-button segment"
            type="button"
            role="radio"
            aria-checked="true"
            tabindex="0"
            title="Stacked">
            <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/></svg>
            <span class="control-label visually-hidden">Stacked</span>
          </button>
          <button
            id="layout-vertical"
            class="icon-button segment"
            type="button"
            role="radio"
            aria-checked="false"
            tabindex="-1"
            title="Side by side">
            <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/></svg>
            <span class="control-label visually-hidden">Side by side</span>
          </button>
        </div>
        <!-- FR-406's description target. Deliberately empty: VC-415 requires
             the hint string to be absent from the document at >= 900 px, so
             `src/main.ts` writes it only while the narrow override is in
             force and clears it again on the way back up. -->
        <span id="layout-narrow-hint" class="visually-hidden"></span>
        <button id="btn-files" class="icon-button btn" type="button" aria-expanded="false" aria-controls="file-pane" title="Files">
          <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 3h9v11H3zM3 6V4h7l2 2h7v3"/></svg>
          <span class="control-label visually-hidden">Files</span>
        </button>
        <!-- FR-1301 / FR-1303: after Files; aria-expanded is the preference, not stdin. -->
        <button id="btn-output" class="icon-button btn" type="button" aria-expanded="true" aria-controls="console-pane stdin-pane diagnostics-pane" title="Output">
          <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></svg>
          <span class="control-label visually-hidden">Output</span>
        </button>
        <!-- FR-301: immediately before the color-mode control. It has no
             disabled state, so unlike Run/Stop/Format it is never routed
             through `setInert()`. -->
        <button
          id="btn-symbols"
          class="icon-button btn"
          type="button"
          tabindex="0"
          aria-expanded="false"
          aria-controls="symbol-pane"
          title="Symbols">
          <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h6v-3a7 7 0 1 1 4 0v3h6"/></svg>
          <span class="control-label visually-hidden">Symbols</span>
        </button>
        <!-- FR-501: immediately after Symbols. Glyph / title / aria-label filled
             by src/theme.ts. Never routed through `setInert()`. Explicit
             `tabindex="0"` matches Run/Stop/Format so WebKit keeps the control
             in the sequential focus navigation order (FR-513 / VC-511). -->
        <button id="btn-theme" class="btn btn--theme" type="button" tabindex="0"></button>
        <!-- FR-801: last toolbar control, immediately after `#btn-theme`. Glyph /
             title / aria-label filled by src/about.ts. Never routed through
             `setInert()` (BR-806). Explicit `tabindex="0"` so WebKit keeps the
             icon control in sequential focus (NFR-806). -->
        <button id="btn-about" class="btn btn--about" type="button" tabindex="0"></button>
      </header>

      <p id="coi-banner" class="banner" role="status" hidden></p>

      <p id="status-bar" class="status-bar" aria-live="polite">Loading Python… 0%</p>

      <div id="notices" class="notices" aria-live="polite"></div>

      <!-- FR-317: the pane sits here in the document at every viewport width;
           the wide layout's inline-end column is grid placement only. Its 29
           character buttons are rendered from `src/symbols.ts`. -->
      <section
        id="symbol-pane"
        class="panel panel--symbols"
        role="toolbar"
        aria-label="Special characters"
        aria-orientation="vertical"
        hidden
      >
        <p id="symbol-status" class="symbol-status" role="status"></p>
      </section>

      <section id="console-pane" class="panel panel--console" aria-label="Console">
        <div class="panel-heading">
          <h2 id="console-heading" class="panel-title">Console</h2>
          <div class="panel-actions">
            <button id="btn-clear" class="icon-button btn" type="button" title="Clear console">
              <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
              <span class="control-label visually-hidden">Clear console</span>
            </button>
            <!-- FR-1501 / FR-1505: after Clear; inert while the transcript is empty. -->
            <button id="btn-copy-output" class="icon-button btn" type="button" tabindex="0" aria-disabled="true" title="Copy output">
              <svg class="control-icon icon-copy" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>
              <svg class="control-icon icon-check" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
              <span class="control-label visually-hidden">Copy output</span>
            </button>
          </div>
        </div>
        <div id="console" class="console"></div>
        <!-- FR-1314: stacked height handle, inside the panel like `#file-resizer`. -->
        <div id="console-resizer" class="console-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize console panel" aria-valuemin="80" aria-valuemax="80" aria-valuenow="80" tabindex="0"></div>
      </section>

      <section class="panel panel--editor" aria-label="Editor">
        <div class="panel-heading editor-heading">
          <h2>Editing: <span id="active-file-name">main.py</span></h2>
          <div class="panel-actions">
            <button id="btn-copy" class="icon-button btn" type="button" title="Copy code">
              <svg class="control-icon icon-copy" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>
              <svg class="control-icon icon-check" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
              <span class="control-label visually-hidden">Copy code</span>
            </button>
            <button id="btn-format" class="icon-button btn" type="button" tabindex="0" aria-disabled="true" title="Format">
              <svg class="control-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H6v6l-2 2 2 2v6h2m8-16h2v6l2 2-2 2v6h-2M10 8h4m-4 4h4m-4 4h4"/></svg>
              <span class="control-label visually-hidden">Format</span>
            </button>
          </div>
        </div>
        <div id="editor" class="editor">
          <p id="editor-running-hint" class="editor-running-hint" role="status" hidden></p>
        </div>
      </section>

      <!-- FR-1305 / BR-1302: overlay on the output column start; not a grid track. -->
      <div id="output-resizer" class="output-resizer" role="separator" aria-orientation="vertical" aria-label="Resize output pane" aria-valuemin="240" aria-valuemax="240" aria-valuenow="240" tabindex="0"></div>

      <!-- FR-913: non-panel sibling immediately after the editor, before stdin.
           Visible only in vertical ≥ 900 px (CSS + hidden); mountDiagResizer
           applies setInert for FR-906. aria-value* filled by the controller
           after measure. Label matches DIAG_RESIZER_LABEL (FR-903). -->
      <div
        id="diag-resizer"
        class="diag-resizer"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize diagnostics panel"
        aria-valuemin="1"
        aria-valuemax="1"
        aria-valuenow="1"
        tabindex="0"
      ></div>

      <section id="stdin-pane" class="panel panel--stdin" aria-label="Standard input">
        <label class="stdin-label" for="stdin-input">Input</label>
        <input
          id="stdin-input"
          class="stdin-input"
          type="text"
          autocomplete="off"
          placeholder="Program is not waiting for input"
          tabindex="0"
          aria-disabled="true"
          readonly
        />
        <button id="btn-eof" class="btn" type="button" tabindex="0" aria-disabled="true">Send EOF</button>
      </section>

      <section id="diagnostics-pane" class="panel panel--diagnostics" aria-label="Diagnostics">
        <h2 class="panel-title">
          Problems <span id="diagnostics-count" class="count">0</span>
        </h2>
        <!-- tabindex=-1: vertical layout sets overflow:auto on these for the
             flex-collapsed body; Chromium would otherwise insert them into
             sequential focus as scroll containers. Entry buttons stay tabbable. -->
        <ul id="diagnostics-list" class="diagnostics-list" tabindex="-1"></ul>
        <p id="diagnostics-empty" class="diagnostics-empty" tabindex="-1">Linter unavailable.</p>
      </section>

      <!-- FR-317 pins `#symbol-pane` immediately after `#notices` and before
           the console panel; FR-410 pins console/editor/stdin/diagnostics as
           one uninterrupted run. The files pane sits here instead, after both
           runs — its `.panel--files` grid-area places it visually without
           moving it in the document. -->
      <section id="file-pane" class="panel panel--files" aria-label="Files" hidden>
        <div class="files-heading">
          <h2 class="panel-title">Files</h2>
          <div class="files-actions">
            <button id="btn-file-new" class="btn btn--small" type="button">New</button>
            <button id="btn-file-rename" class="btn btn--small" type="button" aria-disabled="true">Rename</button>
            <button id="btn-file-delete" class="btn btn--small" type="button" aria-disabled="true">Delete</button>
          </div>
        </div>
        <input id="file-name-input" class="file-name-input" type="text" hidden />
        <ul id="file-tree" class="file-tree" role="tree" aria-label="Workspace files"></ul>
        <div
          id="file-resizer"
          class="file-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize files panel"
          aria-valuemin="160"
          aria-valuemax="480"
          aria-valuenow="260"
          tabindex="0"
        ></div>
      </section>

      <!-- FR-805 / FR-818: About dialog + backdrop. Start hidden; chrome and
           field texts are filled by src/about.ts from format.ts / buildMeta. -->
      <div id="about-backdrop" class="about-backdrop" hidden></div>
      <div
        id="about-dialog"
        class="about-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="about-title"
        hidden
      >
        <h2 id="about-title" class="about-dialog__title"></h2>
        <dl class="about-dialog__fields">
          <div class="about-dialog__row">
            <dt id="about-version-label" class="about-dialog__label"></dt>
            <dd id="about-version" class="about-dialog__value"></dd>
          </div>
          <div class="about-dialog__row">
            <dt id="about-branch-label" class="about-dialog__label"></dt>
            <dd id="about-branch" class="about-dialog__value"></dd>
          </div>
          <div class="about-dialog__row">
            <dt id="about-commit-label" class="about-dialog__label"></dt>
            <dd id="about-commit" class="about-dialog__value"></dd>
          </div>
          <div class="about-dialog__row">
            <dt id="about-built-label" class="about-dialog__label"></dt>
            <dd id="about-built" class="about-dialog__value"></dd>
          </div>
        </dl>
        <button id="about-close" class="btn about-dialog__close" type="button"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
